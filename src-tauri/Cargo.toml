[package]
name = "app"
version = "0.1.0"
description = "Link: your phone and PC as one set of devices, peer to peer on your own network"
authors = ["Rodix"]
license = "GPL-3.0-only"
repository = "https://github.com/dixittharunraja/link"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# "staticlib" is only needed for iOS, which this project doesn't target. With fat LTO it produced a
# ~550 MB app_lib.lib that was copied into a new target/**/build/app/<hash>/out on every build.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[features]
# The web inspector is always on in debug builds (Tauri enables it under debug_assertions). This opts a
# release build into it as well, for diagnosing an installed build: `cargo tauri build --features devtools`.
devtools = ["tauri/devtools"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"

# The Rust protocol core (core/) is desktop-only; Android runs the Java implementation.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
# Exactly what core/ uses (spawn, select!/pin!/#[tokio::test], TCP/UDP, mpsc/Mutex/RwLock/Semaphore/Notify,
# sleep/timeout/interval, AsyncRead/Write ext and BufStream, tokio::fs, tokio::process). Add one here if a
# new module needs it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "process"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "fast-rng"] }
rcgen = "0.14"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
socket2 = "0.5"
local-ip-address = "0.6"
if-addrs = "0.15"
base64 = "0.22"
whoami = "1.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
x509-parser = "0.17"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
urlencoding = "2"
arboard = "3"
ring = "0.17"
opus-decoder = "0.1"
audiopus = "0.3.0-rc.0"
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
webrtc = "0.21.1"
# Loads Cisco's OpenH264 library from disk (downloaded on first use, see core/openh264_lib.rs); it is not compiled in.
openh264 = { version = "0.9.10", default-features = false, features = ["libloading"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
bzip2 = "0.6"
rtc = "0.21.1"
bytes = "1.12.1"
async-trait = "0.1.92"
# mDNS for paired devices only (core/mdns.rs): opaque rotating instance ids, no names on the wire.
mdns-sd = "0.21"

# Lock state, battery and audio endpoints for the plugins the desktop hosts for paired devices.
[target.'cfg(windows)'.dependencies]
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_StationsAndDesktops",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem",
    "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Media",
    "Win32_System_DataExchange", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi",
    "Win32_Devices_DeviceAndDriverInstallation", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO",
] }
windows = { version = "0.61", features = [
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_Foundation",
    "Media_Control", "Foundation", "Foundation_Collections", "Devices", "Devices_Geolocation",
    "Win32_Media_MediaFoundation", "Win32_System_Ole", "Win32_Graphics_Imaging",
] }
# #[windows::core::implement] expands to `::windows_core` paths, so the crate the windows crate already
# pulls in must be a direct dependency (the Core Audio change callbacks in plugins/volume.rs).
windows-core = "0.61"
libloading = "0.9"
# The service that switches the Second Screen virtual display on and off (core/display_helper.rs).
windows-service = "0.8"

# Compilation speed optimizations
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

# Dependencies are optimised even in dev builds. Screen sharing resizes, colour-converts and
# H.264-encodes a 1080p frame 30 times a second; at opt-level 0 that is slower than real time, so the
# video stalls and the connection is dropped. Our own crate stays unoptimised for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Release builds favour size (the installer is downloaded by users); "s" rather than "z" keeps
# screen capture and JPEG encoding quick enough.
#
# Fat LTO and a single codegen unit let the optimiser inline and drop dead code across all crates (a smaller,
# slightly faster binary) at the cost of a longer release link. panic stays "unwind": the core relies on a
# panicking tokio task or thread taking down only itself (and recovers poisoned mutexes, e.g. share.rs,
# clipboard.rs, display_helper.rs), so "abort" would turn any such panic into a crash of the whole app.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

