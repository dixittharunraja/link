<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.85);
      box-shadow: 0 0 8px 2px rgba(255, 0, 0, 0.5);
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }
  </style>
</head>
<body>
  <div id="dot"></div>
  <script>
    const dot = document.getElementById('dot');
    window.presenterApi.onPosition((xFraction, yFraction) => {
      dot.style.left = (xFraction * window.innerWidth) + 'px';
      dot.style.top = (yFraction * window.innerHeight) + 'px';
    });
  </script>
</body>
</html>
